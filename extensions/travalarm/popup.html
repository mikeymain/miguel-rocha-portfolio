<!doctype html>
<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        width: 280px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 16px;
        background: rgb(29, 29, 32);
        color: #f0f0f2;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      h3 {
        font-family: "Cinzel", serif;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 10px;
        margin-top: 0;
        margin-bottom: 14px;
        color: #f5a623;
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 700;
      }
      .entry {
        font-size: 12px;
        margin-bottom: 4px;
        background: #18181b;
        padding: 9px 10px;
        border-radius: 6px;
        border-left: 3px solid rgba(255, 255, 255, 0.06);
        transition: border-color 0.15s ease;
      }
      .entry:hover {
        border-left-color: #f5a623;
      }
      .entry strong {
        color: #f0f0f2;
        font-weight: 500;
        font-size: 11px;
      }
      .time {
        color: #34d399;
        font-size: 10px;
        display: block;
        margin-top: 4px;
        font-family: "JetBrains Mono", "Consolas", monospace;
        opacity: 0.7;
        letter-spacing: 0.5px;
      }
      #clear {
        margin-top: 14px;
        cursor: pointer;
        font-size: 10px;
        color: #8b8b95;
        border: none;
        background: none;
        opacity: 0.6;
        transition: all 0.15s ease;
        padding: 0;
        font-family: "JetBrains Mono", monospace;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      #clear:hover {
        opacity: 1;
        color: #ef4444;
      }
      #historyList p {
        color: #5a5a65;
        font-size: 10px;
        text-align: center;
        padding: 24px 0;
        font-family: "Cinzel", serif;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h3>Building History</h3>
    <div id="historyList">Loading...</div>
    <button id="clear">Clear History</button>
    <script src="popup.js"></script>
  </body>
</html>

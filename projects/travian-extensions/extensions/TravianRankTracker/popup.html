<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Rank Tracker</title>
		<link rel="stylesheet" href="popup.css" />
		<script src="chart.js"></script>
		<script src="utils.js"></script>
		<script src="popup/format.js"></script>
		<script src="popup/now-view.js"></script>
		<script src="popup/metrics.js"></script>
		<script src="popup/history-view.js"></script>
		<script src="popup/backup.js"></script>
		<script src="popup/app.js"></script>
	</head>
	<body>
		<header class="topbar">
			<div class="brand">
				<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V13h4v7M10 20V6h4v14M16 20v-9h4v9" /></svg>
			</div>
			<nav class="tabs" role="tablist" aria-label="Views">
				<button class="tab" id="tab-now" role="tab" type="button" aria-selected="true" aria-controls="view-now">Now</button>
				<button class="tab" id="tab-hist" role="tab" type="button" aria-selected="false" aria-controls="view-hist">Graph</button>
				<span class="tabs-indicator" aria-hidden="true"></span>
			</nav>
			<span class="meta-chip" id="players" title="Active players"></span>
			<span class="meta-chip" id="playtime" title="Time since you joined"></span>
			<span class="meta-chip" id="servertime" title="Time since server start"></span>
			<div class="status" id="status" data-state="idle" role="status" aria-live="polite">
				<span class="status-dot" aria-hidden="true"></span>
				<span class="status-text" id="status-text"></span>
			</div>
			<div class="topbar-actions">
				<button class="icon-btn" id="btn-backup" type="button" title="Export data" aria-label="Export data">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" /></svg>
				</button>
				<button class="icon-btn" id="btn-restore" type="button" title="Import data" aria-label="Import data">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 19h14" /></svg>
				</button>
				<button class="icon-btn" id="btn-tiers" type="button" title="Rank tiers" aria-label="Rank tiers">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z" /></svg>
				</button>
				<input type="file" id="file-input" accept=".json" hidden />
			</div>
		</header>

		<main class="views">
			<section class="view view-now" id="view-now" role="tabpanel" aria-labelledby="tab-now" tabindex="0">
				<div class="hero" id="hero">
					<div class="hero-main">
						<span class="hero-label">Avg rank</span>
						<div class="hero-rank" id="hero-rank" aria-live="off"></div>
					</div>
					<div class="hero-side">
						<span class="hero-tier" id="hero-tier"></span>
						<span class="hero-pct" id="hero-pct"></span>
					</div>
					<div class="hero-deltas" id="hero-deltas"></div>
				</div>
				<div class="table-wrap">
					<table class="metrics" id="metrics-table">
						<thead>
							<tr>
								<th scope="col" class="col-metric">Metric</th>
								<th scope="col" class="col-rank">Rank</th>
								<th scope="col" class="col-value">Value</th>
								<th scope="col" class="col-delta" title="Since last open">Open</th>
								<th scope="col" class="col-delta">1h</th>
								<th scope="col" class="col-delta">3h</th>
								<th scope="col" class="col-delta">1d</th>
								<th scope="col" class="col-delta">7d</th>
							</tr>
						</thead>
						<tbody id="weekly-body"></tbody>
						<tbody id="general-body"></tbody>
					</table>
				</div>
			</section>

			<section class="view view-hist" id="view-hist" role="tabpanel" aria-labelledby="tab-hist" tabindex="0" hidden>
				<div class="hist-toolbar">
					<div class="seg" id="seg-filter" role="group" aria-label="Data">
						<button class="seg-btn" type="button" data-f="all" aria-pressed="true">Raw</button>
						<button class="seg-btn" type="button" data-f="daily" aria-pressed="false">Daily peaks</button>
					</div>
					<div class="seg" id="seg-mode" role="group" aria-label="Scale">
						<button class="seg-btn" type="button" data-mode="abs" aria-pressed="true">Absolute</button>
						<button class="seg-btn" type="button" data-mode="rate" aria-pressed="false">Per hour</button>
					</div>
					<div class="seg" id="seg-range" role="group" aria-label="Range">
						<button class="seg-btn" type="button" data-h="3" aria-pressed="false">3h</button>
						<button class="seg-btn" type="button" data-h="6" aria-pressed="false">6h</button>
						<button class="seg-btn" type="button" data-h="12" aria-pressed="false">12h</button>
						<button class="seg-btn" type="button" data-h="24" aria-pressed="false">24h</button>
						<button class="seg-btn" type="button" data-h="48" aria-pressed="false">48h</button>
						<button class="seg-btn" type="button" data-h="72" aria-pressed="false">72h</button>
						<button class="seg-btn" type="button" data-h="168" aria-pressed="false">1w</button>
					</div>
					<button class="ghost-btn" id="btn-zoom-reset" type="button" hidden>Reset zoom</button>
					<div class="toolbar-spacer"></div>
					<div class="group-bar">
						<button class="ghost-btn" id="btn-group-none" type="button">Clear</button>
						<div class="group-list" id="group-list"></div>
						<button class="ghost-btn" id="btn-group-save" type="button">Save group</button>
					</div>
				</div>
				<form class="group-form" id="group-form" hidden>
					<input type="text" id="group-name" maxlength="40" placeholder="Group name" aria-label="Group name" required />
					<button class="primary-btn" type="submit">Save</button>
					<button class="ghost-btn" type="button" id="btn-group-cancel">Cancel</button>
				</form>
				<div class="hist-body">
				<div class="metric-picker" id="metric-picker"></div>
				<div class="chart-wrap">
					<canvas id="rankChart"></canvas>
					<div class="compare-box" id="compare-box" data-open="false"></div>
					<p class="chart-empty" id="chart-empty" hidden>No history yet. Open the popup on a Travian tab to record a point.</p>
				</div>
				</div>
			</section>
		</main>

		<dialog class="tiers-dialog" id="tiers-dialog" aria-labelledby="tiers-title">
			<h2 class="tiers-title" id="tiers-title">Rank tiers</h2>
			<ul class="tiers-list" id="tiers-list"></ul>
			<button class="ghost-btn" id="btn-tiers-close" type="button">Close</button>
		</dialog>
	</body>
</html>

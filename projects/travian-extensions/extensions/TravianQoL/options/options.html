<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="dark" />
		<title>Travian QoL — Settings</title>
		<!-- Pre-establish the font CDN connection so the @font-face requests
		     don't pay a DNS+TLS round trip when the stylesheet resolves. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="options.css" />
		<link rel="stylesheet" href="counter.css" />
		<link rel="stylesheet" href="build-order.css" />
	</head>
	<body>
		<div class="app">
			<header class="bar">
				<div class="brand">
					<span class="brand__mark" aria-hidden="true">
						<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
						</svg>
					</span>
					<span class="brand__title">Travian QoL</span>
					<span class="brand__ver" id="app-version"></span>
				</div>

				<nav class="tabs" aria-label="Settings sections" role="tablist">
					<button id="tabbtn-features" class="tabs__item is-active" data-tab="features" role="tab" aria-selected="true" aria-controls="tab-features">
						<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
						</svg>
						<span>Features</span>
					</button>
					<button id="tabbtn-loot-calc" class="tabs__item" data-tab="loot-calc" role="tab" aria-selected="false" aria-controls="tab-loot-calc" tabindex="-1">
						<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<rect x="4" y="3" width="16" height="18" rx="2"/>
							<path d="M8 7h8M8 11h8M8 15h5"/>
						</svg>
						<span>Loot Calculator</span>
					</button>
					<button id="tabbtn-counter" class="tabs__item" data-tab="counter" role="tab" aria-selected="false" aria-controls="tab-counter" tabindex="-1">
						<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polyline points="23 4 23 10 17 10"/>
							<polyline points="1 20 1 14 7 14"/>
							<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
						</svg>
						<span>Counter-attack</span>
					</button>
					<button id="tabbtn-build-order" class="tabs__item" data-tab="build-order" role="tab" aria-selected="false" aria-controls="tab-build-order" tabindex="-1">
						<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M3 20h18M6 20V10M12 20V4M18 20v-7"/>
						</svg>
						<span>Build order</span>
					</button>
				</nav>

				<div class="bar__status" id="save-status" role="status">
					<span class="bar__dot" aria-hidden="true"></span>
					<span class="bar__status-text">Saved</span>
				</div>
			</header>

			<main class="stage">
				<section id="tab-features" class="panel is-active" role="tabpanel" aria-labelledby="tabbtn-features" tabindex="0">
					<header class="panel__head">
						<h1 class="panel__title">Features</h1>
						<div class="panel__meta">
							<span class="count" id="feature-active-count"></span>
							<button type="button" class="btn" id="features-all-on">All on</button>
							<button type="button" class="btn" id="features-all-off">All off</button>
						</div>
					</header>
					<div id="features" class="groups"></div>
				</section>

				<section id="tab-loot-calc" class="panel" role="tabpanel" aria-labelledby="tabbtn-loot-calc" tabindex="0">
					<header class="panel__head">
						<h1 class="panel__title">Loot Calculator</h1>
						<div class="server-pick">
							<label for="lc-server">Server</label>
							<select id="lc-server" class="select"></select>
						</div>
					</header>
					<div id="lc-settings" class="lc-grid"></div>
				</section>

				<section id="tab-build-order" class="panel" role="tabpanel" aria-labelledby="tabbtn-build-order" tabindex="0">
					<header class="panel__head">
						<h1 class="panel__title">Build order</h1>
						<div class="server-pick">
							<label for="bo-village">Village</label>
							<select id="bo-village" class="select"></select>
						</div>
					</header>
					<div id="bo-root" class="bo"></div>
				</section>

				<section id="tab-counter" class="panel" role="tabpanel" aria-labelledby="tabbtn-counter" tabindex="0">
					<header class="panel__head">
						<h1 class="panel__title">Counter-attack</h1>
						<div class="ca__server">
							<label class="ca__inline">
								<span>Speed</span>
								<select id="ca-server-speed" class="select">
									<option value="1">1×</option>
									<option value="2">2×</option>
									<option value="3" selected>3×</option>
									<option value="5">5×</option>
									<option value="10">10×</option>
								</select>
							</label>
							<label class="ca__inline">
								<span>Map</span>
								<select id="ca-map" class="select">
									<option value="200">200</option>
									<option value="400" selected>400</option>
									<option value="800">800</option>
								</select>
							</label>
						</div>
					</header>

					<div class="ca">
						<div class="ca__inputs">
							<!-- Incoming attack + attacker -->
							<section class="card ca__card" data-side="att">
								<div class="lc-card__head ca__head">
									<span class="ca__dot ca__dot--hit" aria-hidden="true"></span>
									<span class="lc-card__title">Incoming attack</span>
								</div>
								<div class="ca__body">
									<div class="ca__grid ca__grid--time">
										<label class="ca__field">
											<span class="ca__label">Arrives in</span>
											<input id="ca-arrives-in" type="text" placeholder="h:mm:ss" inputmode="numeric" autocomplete="off" class="lc-num">
										</label>
										<label class="ca__field">
											<span class="ca__label">Arrival</span>
											<input id="ca-arrival" type="datetime-local" step="1" class="lc-num">
										</label>
									</div>
									<div class="ca__grid ca__grid--coords">
										<label class="ca__field">
											<span class="ca__label">Target</span>
											<input id="ca-target" type="text" placeholder="(x|y)" autocomplete="off" class="lc-num">
										</label>
										<label class="ca__field">
											<span class="ca__label">Attacker</span>
											<input data-att="coords" type="text" placeholder="(x|y)" autocomplete="off" class="lc-num">
										</label>
										<label class="ca__field">
											<span class="ca__label">Slowest unit</span>
											<select data-att="speed" class="select"></select>
										</label>
									</div>
								</div>
								<details class="ca__bonus">
									<summary><span>Bonuses</span><span class="ca__bonus-sum" data-sum="att"></span></summary>
									<div class="ca__grid ca__grid--3">
										<label class="ca__field">
											<span class="ca__label">TS</span>
											<select data-att="ts" class="select"></select>
										</label>
										<label class="ca__field">
											<span class="ca__label">Boots</span>
											<select data-att="boots" class="select">
												<option value="1">—</option>
												<option value="1.25">+25%</option>
												<option value="1.50">+50%</option>
												<option value="1.75">+75%</option>
											</select>
										</label>
										<label class="ca__field">
											<span class="ca__label">Artefact</span>
											<select data-att="art" class="select">
												<option value="0.33">0.33×</option>
												<option value="0.5">0.5×</option>
												<option value="0.67">0.67×</option>
												<option value="1" selected>—</option>
												<option value="1.5">1.5×</option>
												<option value="2">2×</option>
												<option value="3">3×</option>
											</select>
										</label>
									</div>
								</details>
							</section>

							<!-- Your counter -->
							<section class="card ca__card" data-side="int">
								<div class="lc-card__head ca__head">
									<span class="ca__dot ca__dot--you" aria-hidden="true"></span>
									<span class="lc-card__title">Your counter</span>
								</div>
								<div class="ca__body">
									<div class="ca__grid ca__grid--from">
										<label class="ca__field">
											<span class="ca__label">From</span>
											<input data-int="coords" type="text" placeholder="(x|y)" autocomplete="off" class="lc-num">
										</label>
										<label class="ca__field ca__field--village" hidden>
											<span class="ca__label">My village</span>
											<select id="ca-int-village" class="select"></select>
										</label>
									</div>
									<div class="ca__grid ca__grid--from">
										<label class="ca__field">
											<span class="ca__label">Land after (s)</span>
											<input data-int="delay" type="number" min="0" step="1" value="0" class="lc-num">
										</label>
										<label class="ca__field">
											<span class="ca__label">Slowest unit</span>
											<select data-int="speed" class="select"></select>
										</label>
									</div>
								</div>
								<details class="ca__bonus">
									<summary><span>Bonuses</span><span class="ca__bonus-sum" data-sum="int"></span></summary>
									<div class="ca__grid ca__grid--3">
										<label class="ca__field">
											<span class="ca__label">TS</span>
											<select data-int="ts" class="select"></select>
										</label>
										<label class="ca__field">
											<span class="ca__label">Boots</span>
											<select data-int="boots" class="select">
												<option value="1">—</option>
												<option value="1.25">+25%</option>
												<option value="1.50">+50%</option>
												<option value="1.75">+75%</option>
											</select>
										</label>
										<label class="ca__field">
											<span class="ca__label">Artefact</span>
											<select data-int="art" class="select">
												<option value="0.33">0.33×</option>
												<option value="0.5">0.5×</option>
												<option value="0.67">0.67×</option>
												<option value="1" selected>—</option>
												<option value="1.5">1.5×</option>
												<option value="2">2×</option>
												<option value="3">3×</option>
											</select>
										</label>
									</div>
								</details>
							</section>
						</div>

						<div class="ca__result">
							<div class="ca__out" id="ca-out" role="status" aria-live="polite"></div>
						</div>
					</div>
				</section>


			</main>
		</div>

		<script src="../lib/registry.js"></script>
		<script src="../features/farmlist-multi-select/index.js"></script>
		<script src="../features/farmlist-bounty-sort/index.js"></script>
		<script src="../features/farmlist-edit-chooser/index.js"></script>
		<script src="../features/adventure-sort/index.js"></script>
		<script src="../features/village-resource-total/index.js"></script>
		<script src="../features/report-opener/index.js"></script>
		<script src="../features/loot-calc/index.js"></script>
		<script src="../features/todolist/index.js"></script>
		<script src="../features/upgrade-values/index.js"></script>
		<script src="../features/build-order/core.js"></script>
		<script src="../features/build-order/index.js"></script>
		<script src="../features/smithy-efficiency/core.js"></script>
		<script src="../features/smithy-efficiency/index.js"></script>
		<script src="../features/resource-full-time/index.js"></script>
		<script src="../features/trade-route-production/core.js"></script>
		<script src="../features/trade-route-production/index.js"></script>
		<script src="options.js"></script>
		<script src="counter.js"></script>
		<script src="build-order.js"></script>
	</body>
</html>

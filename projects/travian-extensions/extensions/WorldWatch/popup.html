<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>World Watch</title>
		<link rel="stylesheet" href="style.css" />
		<script src="lib/core.js"></script>
		<script src="lib/db.js"></script>
		<script src="popup.js" defer></script>
	</head>
	<body class="popup">
		<h1>World Watch</h1>
		<form id="add-form" class="row">
			<label for="host-input" class="sr-only">World host</label>
			<input id="host-input" type="text" placeholder="ts4.x1.arabics.travian.com" autocomplete="off" spellcheck="false" />
			<button type="submit">Add</button>
		</form>
		<p id="msg" class="msg" role="status" aria-live="polite"></p>
		<table class="grid">
			<thead>
				<tr>
					<th>World</th>
					<th>Snapshots</th>
					<th>Changed</th>
					<th>Checked</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="hosts"></tbody>
		</table>
		<p id="empty" class="msg" hidden>Add a world host to start tracking.</p>
		<div class="row">
			<label for="interval">Interval (min)</label>
			<input id="interval" type="number" min="15" max="1440" step="5" />
			<button id="poll" type="button">Fetch now</button>
			<button id="open-dash" type="button">Dashboard</button>
		</div>
		<section id="map-scan" hidden aria-labelledby="scan-title">
			<h2 id="scan-title">Map grid scan</h2>
			<form id="scan-form" class="row">
				<label>Centre <input id="scan-centre" type="text" placeholder="0|0" size="8" required aria-describedby="scan-help" /></label>
				<label>Radius
					<select id="scan-radius">
						<option value="5">5 tiles</option>
						<option value="10">10 tiles</option>
						<option value="15">15 tiles</option>
					</select>
				</label>
				<button id="scan-start" type="submit">Start scan</button>
				<button id="scan-stop" type="button" hidden>Stop scan</button>
			</form>
			<p id="scan-help" class="msg">Set the game map to 100% zoom before scanning.</p>
			<p id="scan-status" class="msg" role="status" hidden></p>
		</section>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>World Watch</title>
		<link rel="stylesheet" href="style.css" />
		<script src="lib/analysis.js"></script>
		<script src="lib/db.js"></script>
		<script src="map-view.js"></script>
		<script src="dashboard.js" defer></script>
	</head>
	<body class="dash">
		<header class="row">
			<h1>World Watch</h1>
			<label for="host">World</label>
			<select id="host"></select>
			<label for="cur">Snapshot</label>
			<select id="cur"></select>
			<label for="prev">Compare with</label>
			<select id="prev"></select>
		</header>
		<p id="msg" class="msg" role="status" aria-live="polite"></p>
		<nav class="tabs" role="tablist" aria-label="Views">
			<button type="button" role="tab" data-view="growth" aria-selected="true">Growth</button>
			<button type="button" role="tab" data-view="spawn" aria-selected="false">Spawn ring</button>
			<button type="button" role="tab" data-view="gold" aria-selected="false">Gold suspects</button>
			<button type="button" role="tab" data-view="alliances" aria-selected="false">Alliances</button>
			<button type="button" role="tab" data-view="map" aria-selected="false">Map</button>
		</nav>
		<section id="controls-map" class="row" hidden>
			<label for="map-count">Newest accounts</label>
			<input id="map-count" type="number" min="5" max="500" value="40" />
			<label><input id="map-spawns" type="checkbox" checked /> Spawns</label>
			<label><input id="map-alliances" type="checkbox" checked /> Alliances</label>
			<label><input id="map-top10" type="checkbox" /> Top 10</label>
			<label><input id="map-top100" type="checkbox" /> Top 100</label>
			<label for="map-goto">Centre (x|y)</label>
			<input id="map-goto" type="text" placeholder="0|0" autocomplete="off" />
			<button id="map-go" type="button">Go</button>
			<button id="map-newest" type="button">Newest spawn</button>
		</section>
		<section id="map-section" class="map-layout" hidden>
			<div class="tv-window">
				<div class="tv-title">
					<span>Map</span>
					<span class="tv-tools">
						<button id="map-zoom-in" type="button" class="tv-btn" aria-label="Zoom in">+</button>
						<button id="map-zoom-out" type="button" class="tv-btn" aria-label="Zoom out">−</button>
						<span id="map-zoom" class="tv-zoom">100%</span>
						<span id="map-pos" class="tv-zoom"></span>
					</span>
				</div>
				<div class="tv-body">
					<div id="map-canvas"></div>
					<div id="map-tip" class="tv-tip" hidden></div>
				</div>
			</div>
			<ul id="map-legend" class="map-legend"></ul>
		</section>
		<section id="controls-spawn" class="row" hidden>
			<label for="spawn-count">Newest accounts</label>
			<input id="spawn-count" type="number" min="5" max="500" value="40" />
		</section>
		<section id="controls-gold" class="row" hidden>
			<label for="point">Point (x|y)</label>
			<input id="point" type="text" placeholder="0|0" autocomplete="off" />
			<label for="radius">Radius</label>
			<input id="radius" type="number" min="1" max="300" placeholder="all" />
			<label><input id="flagged" type="checkbox" /> Above p99 only</label>
		</section>
		<div class="row">
			<span id="summary" class="summary"></span>
			<button id="csv" type="button">CSV</button>
		</div>
		<div class="table-wrap" id="table-wrap">
			<table class="grid" id="table">
				<thead></thead>
				<tbody></tbody>
			</table>
		</div>
	</body>
</html>

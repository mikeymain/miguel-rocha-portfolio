<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gym</title>
    <meta
      name="description"
      content="A mobile-first workout tracker for recording sets, reviewing progress and adapting training."
    />
    <meta name="theme-color" content="#FBF6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1118" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lift" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link
      rel="preload"
      href="fonts/bricolage-grotesque-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="timer" hidden></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <script type="module" src="js/main.js"></script>
  </body>
</html>

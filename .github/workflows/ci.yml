name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: Lint, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build-lab:
    name: Build Lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/build-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/build-lab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  pc-remote:
    name: PC Remote
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/pc-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/pc-remote/requirements-dev.txt
      - run: pip install -r requirements-dev.txt black==26.3.1
      - run: black --check .
      - run: python -m pytest
